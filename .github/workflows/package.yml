name: Package

on:
  push:
    # The dmg format refuses a major version of 0.
    tags: [ 'v[1-9]*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Builds the deb, dmg or msi of the runner's operating system; jpackage cannot cross-compile.
      - name: Package
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS ${VERSION:+-PappVersion=${VERSION#v}}
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: adb-desktop-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/deb/
            desktopApp/build/compose/binaries/main/dmg/
            desktopApp/build/compose/binaries/main/msi/
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish installers
        run: find installers -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

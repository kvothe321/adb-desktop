name: Package

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Builds the deb, dmg or msi of the runner's operating system; jpackage cannot cross-compile.
      - name: Package
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: adb-desktop-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/
          if-no-files-found: error

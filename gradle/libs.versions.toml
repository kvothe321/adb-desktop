[versions]
#################################################################################
# Compatibility notes
#
#   Kotlin 2.4.21  <--> Gradle 7.6.3 .. 9.7.0 (fully supported range)
#   Gradle Wrapper 9.7.1 is the newest release inside that range.
#   JDK toolchain 21: newest LTS validated for Compose Desktop packaging (jpackage needs >= 17).
#                     After changing `java`, run ./gradlew updateDaemonJvm --jvm-version=<version>.
#   AGP 9.3.x: only used to give Compose modules an Android target so IDE @Preview rendering works.
#              The app itself ships on desktop only.
#
#################################################################################
java = "21"
kotlin = "2.4.21"
androidGradlePlugin = "9.3.3"
composeMultiplatform = "1.12.2"
composeHotReload = "1.2.0"
# compose-rules 0.4.x is the newest line for detekt 1.23.x; 0.5+ targets the detekt 2.0 alphas.
composeRulesDetekt = "0.4.28"
composeRulesKtlint = "0.6.8"
ktlint = "1.8.0"
androidx-lifecycle = "2.11.0"
androidx-datastore = "1.3.0"
bytedecoFfmpeg = "8.1.2-1.5.14"
bytedecoJavacpp = "1.5.14"
kermit = "2.2.0"
koin = "4.2.2"
kotest = "6.2.6"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
material3 = "1.9.0"
navigation3 = "1.2.0"
turbine = "1.2.1"

[libraries]
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

bytedeco-ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "bytedecoFfmpeg" }
bytedeco-javacpp = { module = "org.bytedeco:javacpp", version.ref = "bytedecoJavacpp" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewModel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRulesKtlint" }

kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Plugins defined by the included build-logic
adbdesktop-global-ktlint = { id = "com.tlpcraft.adbdesktop.plugin.convention.linting.ktlint", version = "unspecified" }
adbdesktop-global-detekt = { id = "com.tlpcraft.adbdesktop.plugin.convention.detekt", version = "unspecified" }
adbdesktop-module-graph = { id = "com.tlpcraft.adbdesktop.plugin.convention.graph", version = "unspecified" }
adbdesktop-commitlint = { id = "com.tlpcraft.adbdesktop.plugin.convention.linting.commitlint", version = "unspecified" }
adbdesktop-kotlin-multiplatform-library = { id = "com.tlpcraft.adbdesktop.plugin.convention.kotlin.multiplatform.library", version = "unspecified" }
adbdesktop-compose-multiplatform-library = { id = "com.tlpcraft.adbdesktop.plugin.convention.compose.multiplatform.library", version = "unspecified" }
adbdesktop-feature-library = { id = "com.tlpcraft.adbdesktop.plugin.convention.feature.library", version = "unspecified" }
